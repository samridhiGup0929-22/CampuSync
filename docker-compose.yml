services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/campus.db
      JWT_SECRET: ${JWT_SECRET:-replace-me-before-deploy}
      CORS_ORIGINS: http://localhost:5173
    volumes: [campus_data:/data]
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  campus_data:
